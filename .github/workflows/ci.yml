name: Tests and experiment smoke run

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the recorded CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
      - name: Verify the shared core imports without Django
        run: python -c "import sys; import rl.training; assert 'django' not in sys.modules"
      - name: Check Django configuration
        run: python manage.py check
      - name: Check browser script syntax
        run: |
          node --check statics/js/new_training.js
          node --check statics/js/comparison.js
      - name: Run tests
        run: python -m pytest -q
      - name: Check frozen reference with alternate NumPy CPU kernels
        env:
          NPY_DISABLE_CPU_FEATURES: AVX2,FMA3,AVX512F
        run: python -m pytest -q tests/test_market_reference.py
      - name: Run the complete four-strategy pipeline
        run: python -m experiments.run --config experiments/configs/quickstart.json --out runs/ci
      - name: Run common-score currency-control smoke pipeline
        run: python -m experiments.balanced_control --config experiments/configs/balanced-control-smoke.json --out runs/balanced-ci
      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-python-${{ matrix.python }}
          path: |
            runs/ci
            runs/balanced-ci

  rl-baselines:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the optional CPU baseline environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt -r requirements-baselines.txt
      - name: Verify the baseline dependency is installed
        run: python -c "import stable_baselines3; print(stable_baselines3.__version__)"
      - name: Run RL baseline integration tests
        run: python -m pytest -q tests/test_rl_baselines.py
